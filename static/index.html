<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YT Clip</title>
<style>
  :root { --bg:#fff; --fg:#1b1d21; --muted:#6b7280; --line:#d9dce1; --accent:#d42b2b; --card:#f6f7f9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --fg:#e8eaed; --muted:#9aa0a6; --line:#2c3037; --accent:#ff5a5a; --card:#1c1f24; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5 system-ui,sans-serif; }
  main { max-width:560px; margin:0 auto; padding:32px 16px; }
  h1 { font-size:1.4rem; margin:0 0 20px; }
  label { display:block; font-size:.85rem; color:var(--muted); margin:14px 0 4px; }
  input { width:100%; padding:10px 12px; font:inherit; color:inherit; background:var(--card);
          border:1px solid var(--line); border-radius:8px; }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  button { margin-top:20px; width:100%; padding:12px; font:inherit; font-weight:600; color:#fff;
           background:var(--accent); border:0; border-radius:8px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  .hint { font-size:.8rem; color:var(--muted); margin-top:4px; }
  #status { margin-top:24px; display:none; }
  .bar { height:8px; background:var(--card); border:1px solid var(--line); border-radius:99px; overflow:hidden; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .3s; }
  #msg { margin-top:8px; font-size:.9rem; word-break:break-word; }
  #msg.error { color:var(--accent); }
  a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>YT Clip</h1>
  <form id="form">
    <label for="url">URL de YouTube</label>
    <input id="url" type="url" required placeholder="https://www.youtube.com/watch?v=..." autofocus>

    <div class="row">
      <div>
        <label for="start">Inicio (opcional)</label>
        <input id="start" placeholder="0:00">
      </div>
      <div>
        <label for="end">Fin (opcional)</label>
        <input id="end" placeholder="1:30">
      </div>
    </div>
    <div class="hint">Formato SS, MM:SS o HH:MM:SS. Déjalos vacíos para bajar el vídeo entero.</div>

    <button id="go" type="submit">Descargar MP4</button>
  </form>

  <div id="status">
    <div class="bar"><div id="fill"></div></div>
    <div id="msg"></div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const form = $("form"), go = $("go"), box = $("status"), fill = $("fill"), msg = $("msg");

const LABELS = { queued: "En cola…", downloading: "Descargando…", processing: "Procesando con ffmpeg…" };

function show(text, { error = false, html = false } = {}) {
  box.style.display = "block";
  msg.className = error ? "error" : "";
  html ? (msg.innerHTML = text) : (msg.textContent = text);
}

async function poll(id) {
  try {
    const r = await fetch(`/api/download/${id}`);
    if (!r.ok) throw new Error("Se perdió la descarga (¿reiniciaste el servidor?)");
    const j = await r.json();
    fill.style.width = `${j.progress}%`;

    if (j.status === "done") {
      const name = j.file.replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
      show(`Listo: <a href="/files/${encodeURIComponent(j.file)}" target="_blank">${name}</a> (guardado en downloads/)`, { html: true });
      go.disabled = false;
    } else if (j.status === "error") {
      show(j.error || "Error desconocido", { error: true });
      go.disabled = false;
    } else {
      show(`${LABELS[j.status] || j.status} ${Math.round(j.progress)}%`);
      setTimeout(() => poll(id), 1000);
    }
  } catch (e) {
    show(e.message, { error: true });
    go.disabled = false;
  }
}

form.addEventListener("submit", async e => {
  e.preventDefault();
  go.disabled = true;
  fill.style.width = "0";
  show("Enviando…");
  try {
    const r = await fetch("/api/download", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: $("url").value, start: $("start").value, end: $("end").value }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || "Petición no válida");
    poll(j.id);
  } catch (err) {
    show(err.message, { error: true });
    go.disabled = false;
  }
});
</script>
</body>
</html>
